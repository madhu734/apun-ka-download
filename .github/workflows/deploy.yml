name: Auto-Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-coolify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Apun Ka Download Webhook on Coolify
        run: |
          echo "Triggering auto-deploy for commit ${{ github.sha }}..."
          curl -sS -X POST "https://download.tmadhu.me/api/webhook/github" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\": \"${{ github.sha }}\", \"repo\": \"${{ github.repository }}\"}" || true
