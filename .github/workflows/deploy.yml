name: Verify deployed YouTube extraction
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public health and media extraction
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.error, urllib.request
          base = "https://download.tmadhu.me"
          def call(path, data=None):
              req = urllib.request.Request(base + path, data=json.dumps(data).encode() if data else None,
                                           headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=95) as res:
                  return json.load(res)
          health = call("/api/health")
          print({key: health.get(key) for key in ("status", "deno", "pot_provider", "yt_dlp", "cookies", "youtube_auth_cookies", "boot_commit")}, flush=True)
          assert health.get("deno"), "New backend is not serving traffic"
          failed = False
          links = [
              ("YouTube", "https://youtu.be/mYwVYXcr-QU", "video"),
              ("YouTube Music", "https://music.youtube.com/watch?v=dQw4w9WgXcQ", "audio"),
          ]
          for name, url, mode in links:
              try:
                  media = call("/api/analyze", {"url": url, "mode": mode})
                  options = media.get("options") or []
                  print(f"{name}: {len(options)} format options", flush=True)
                  assert options, f"{name}: no format options"
              except urllib.error.HTTPError as exc:
                  detail = json.load(exc).get("detail", "")
                  print(f"{name}: HTTP {exc.code}, session rejected: {'rejected the session' in str(detail)}", flush=True)
                  failed = True
          sys.exit(failed)
          PY
