<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F2F4F8">
  <title>Apun Ka Download</title>
  <meta name="description" content="Fast direct-stream downloader for YouTube, YT Music, Facebook, Instagram and TikTok.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111318'/%3E%3Cpath d='M32 14v22m0 0-9-9m9 9 9-9M16 46h32' fill='none' stroke='%233D7EFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <h1>Apun Ka Download</h1>
      <p class="sub">Paste a link, pick a quality, and get the file straight from the source.</p>
    </header>

    <section class="panel" aria-label="Downloader">
      <div class="seg" role="tablist" aria-label="Download type" id="modeToggle">
        <button type="button" role="tab" class="seg-btn is-active" data-mode="video" aria-selected="true">
          <span aria-hidden="true">🎬</span> Video
        </button>
        <button type="button" role="tab" class="seg-btn" data-mode="audio" aria-selected="false">
          <span aria-hidden="true">🎵</span> Audio Only
        </button>
      </div>

      <form class="field" id="urlForm" autocomplete="off">
        <div class="input-wrap">
          <input id="urlInput" type="text" inputmode="url" enterkeyhint="go" spellcheck="false"
                 autocapitalize="off" autocorrect="off" placeholder="Paste a YouTube, Facebook, Instagram or TikTok link"
                 aria-label="Media link">
          <button type="button" id="pasteBtn" class="icon-btn" title="Paste from clipboard" aria-label="Paste from clipboard">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="3" width="8" height="4" rx="1.5"/>
              <path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/>
            </svg>
          </button>
        </div>
        <button type="submit" id="fetchBtn" class="btn-primary">Fetch <span aria-hidden="true">→</span></button>
      </form>

      <div class="badge-row" id="badgeRow" hidden></div>
      <div class="msg msg-notice" id="notice" role="status" hidden></div>
      <div class="msg msg-error" id="error" role="alert" hidden></div>
    </section>

    <section class="proc" id="proc" aria-live="polite" hidden>
      <div class="kinetic" id="kinetic"></div>
      <div class="bar" aria-hidden="true"><i></i></div>
    </section>

    <section class="result" id="result" hidden>
      <div class="media">
        <div class="thumb" id="thumb">
          <img id="thumbImg" alt="" referrerpolicy="no-referrer">
          <div class="thumb-fallback" id="thumbFallback"></div>
          <span class="chip" id="durationChip" hidden></span>
        </div>
        <div class="meta">
          <div class="badge-row" id="resultBadge"></div>
          <h2 id="mediaTitle"></h2>
          <p id="mediaUploader"></p>
        </div>
      </div>
      <div class="options" id="options"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
